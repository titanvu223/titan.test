<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phân Tích Tính Cách AI Qua Ngày Sinh</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            max-width: 420px;
            width: 100%;
            text-align: center;
        }
        h2 {
            color: #333;
            margin-bottom: 8px;
            font-size: 22px;
        }
        p.subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 24px;
        }
        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #444;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #667eea;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: opacity 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }
        #result {
            margin-top: 20px;
            padding: 16px;
            background: #f8f9fa;
            border-radius: 8px;
            text-align: left;
            white-space: pre-wrap;
            line-height: 1.6;
            color: #333;
            font-size: 14px;
            border: 1px solid #e2e8f0;
            display: none;
        }
        .loading {
            color: #667eea !important;
            font-style: italic;
            text-align: center !important;
            border-color: #cbd5e1 !important;
        }
        .error {
            background-color: #fef2f2 !important;
            color: #991b1b !important;
            border-color: #fca5a5 !important;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>🔮 Bói Tính Cách AI</h2>
    <p class="subtitle">Khám phá bản thân qua Ngày & Tháng sinh</p>
    
    <div class="form-group">
        <label for="day">1. Ngày sinh (1 - 31):</label>
        <input type="number" id="day" min="1" max="31" placeholder="Nhập ngày (Ví dụ: 15)">
    </div>

    <div class="form-group">
        <label for="month">2. Tháng sinh (1 - 12):</label>
        <input type="number" id="month" min="1" max="12" placeholder="Nhập tháng (Ví dụ: 8)">
    </div>

    <button onclick="analyze()">XÁC NHẬN & PHÂN TÍCH</button>

    <div id="result"></div>
</div>

<script>
    // ⚠️ BƯỚC QUAN TRỌNG NHẤT:
    // Hãy thay chuỗi DÁN_API_KEY_CỦA_BẠN_VÀO_ĐÂY bên dưới bằng API Key bạn lấy từ Google
    const API_KEY = "DÁN_API_KEY_CỦA_BẠN_VÀO_ĐÂY";

    async function analyze() {
        const day = document.getElementById('day').value;
        const month = document.getElementById('month').value;
        const resultDiv = document.getElementById('result');

        // Kiểm tra đầu vào
        if (!day || !month || day < 1 || day > 31 || month < 1 || month > 12) {
            alert("⚠️ Vui lòng nhập Ngày (1-31) và Tháng (1-12) hợp lệ!");
            return;
        }

        // Kiểm tra xem đã dán API Key chưa
        if (API_KEY === "DÁN_API_KEY_CỦA_BẠN_VÀO_ĐÂY" || API_KEY.trim() === "") {
            resultDiv.style.display = "block";
            resultDiv.className = "error";
            resultDiv.innerText = "❌ LỖI: Bạn chưa dán API Key vào file!\n\nHãy mở file index.html lên, tìm đến dòng có chữ API_KEY và dán mã key từ Google AI Studio vào giữa hai dấu ngoặc kép.";
            return;
        }

        // Hiển thị trạng thái đang tải
        resultDiv.style.display = "block";
        resultDiv.className = "loading";
        resultDiv.innerText = "⏳ AI đang suy nghĩ và đọc tính cách của bạn, vui lòng đợi vài giây...";

        const promptText = `Bạn là một chuyên gia tâm lý và chiêm tinh. Hãy phân tích tính cách, điểm mạnh, điểm yếu và 1 lời khuyên ý nghĩa cho người sinh ngày ${day} tháng ${month}. Hãy viết bằng tiếng Việt, giọng văn ngắn gọn, chuẩn xác, hấp dẫn.`;

        // Danh sách các mô hình AI để tự động thử
        const models = ["gemini-2.5-flash", "gemini-1.5-flash", "gemini-2.0-flash"];
        let isSuccess = false;
        let errorMessage = "";

        for (const model of models) {
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: promptText }] }]
                    })
                });

                const data = await response.json();

                if (response.ok && data.candidates && data.candidates[0].content.parts[0].text) {
                    resultDiv.className = "";
                    resultDiv.innerText = data.candidates[0].content.parts[0].text;
                    isSuccess = true;
                    break;
                } else if (data.error) {
                    errorMessage = data.error.message;
                }
            } catch (err) {
                errorMessage = err.message;
            }
        }

        if (!isSuccess) {
            resultDiv.className = "error";
            resultDiv.innerText = "❌ Lỗi kết nối API: " + errorMessage + "\n\n👉 Vui lòng kiểm tra lại mã API Key xem có bị dán sai/thiếu ký tự không!";
        }
    }
</script>

</body>
</html>
