<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phân Tích Tính Cách Qua Ngày Sinh</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        h2 { color: #333; margin-bottom: 20px; }
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { background-color: #45a049; }
        #result {
            margin-top: 20px;
            padding: 15px;
            background: #eef7ee;
            border-radius: 6px;
            text-align: left;
            white-space: pre-wrap;
            line-height: 1.5;
            color: #222;
        }
        .loading { color: #888; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <h2>Phân Tích Tính Cách</h2>
    
    <div class="form-group">
        <label for="day">Ngày sinh (1 - 31):</label>
        <input type="number" id="day" min="1" max="31" placeholder="Ví dụ: 15">
    </div>

    <div class="form-group">
        <label for="month">Tháng sinh (1 - 12):</label>
        <input type="number" id="month" min="1" max="12" placeholder="Ví dụ: 8">
    </div>

    <button onclick="analyzePersonality()">Xác Nhận & Phân Tích</button>

    <div id="result"></div>
</div>

<script>
    // ⚠️ Dán API Key Gemini của bạn vào giữa hai dấu ngoặc đơn dưới đây:
    const API_KEY = "DÁN_API_KEY_CỦA_BẠN_VÀO_ĐÂY";

    async function analyzePersonality() {
        const day = document.getElementById('day').value;
        const month = document.getElementById('month').value;
        const resultDiv = document.getElementById('result');

        if (!day || !month || day < 1 || day > 31 || month < 1 || month > 12) {
            alert("Vui lòng nhập ngày và tháng sinh hợp lệ!");
            return;
        }

        resultDiv.className = "loading";
        resultDiv.innerHTML = "AI đang suy nghĩ và phân tích tính cách cho bạn, vui lòng đợi tí nhé...";

        const promptText = `Hãy phân tích tính cách, điểm mạnh, điểm yếu và một lời khuyên ngắn gọn cho một người sinh vào ngày ${day} tháng ${month}. Viết ngắn gọn, thú vị và bằng tiếng Việt.`;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{
                        parts: [{ text: promptText }]
                    }]
                })
            });

            const data = await response.json();
            
            if (data.candidates && data.candidates[0].content.parts[0].text) {
                resultDiv.className = "";
                resultDiv.innerText = data.candidates[0].content.parts[0].text;
            } else {
                resultDiv.innerText = "Có lỗi xảy ra khi gọi AI. Vui lòng kiểm tra lại API Key.";
            }
        } catch (error) {
            console.error(error);
            resultDiv.innerText = "Lỗi kết nối tới AI. Vui lòng thử lại sau!";
        }
    }
</script>

</body>
</html>
